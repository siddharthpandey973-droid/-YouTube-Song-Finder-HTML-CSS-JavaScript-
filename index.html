<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Song Finder</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: #fff;
      margin: 0;
      padding: 20px;
      text-align: center;
      min-height: 100vh;
    }
    h1 {
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    input {
      width: 80%;
      max-width: 400px;
      padding: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 15px;
      outline: none;
    }
    button {
      padding: 10px 18px;
      border: none;
      background: #ffcc00;
      color: #000;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 5px;
    }
    button:hover {
      background: #ffd633;
    }
    #videos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      margin-top: 25px;
    }
    .card {
      background: #fff;
      color: #000;
      width: 280px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card h3 {
      font-size: 16px;
      margin: 10px;
      font-weight: bold;
    }
    .card a {
      display: inline-block;
      margin: 10px;
      padding: 8px 12px;
      background: #1e3c72;
      color: #fff;
      border-radius: 5px;
      text-decoration: none;
    }
    .card a:hover { background: #2a5298; }
  </style>
</head>
<body>

  <h1>🎵 YouTube Song Finder</h1>
  <p>Type any mood — e.g. “sad songs”, “motivational songs”, “romantic songs”</p>
  
  <input type="text" id="searchInput" placeholder="Enter song type..." />
  <button onclick="searchVideos()">Search</button>

  <div id="videos">Search something to begin...</div>

  <script>
    const API_KEY = " apni api daalo yha p "; // 👈 Your API key

    async function searchVideos() {
      const query = document.getElementById('searchInput').value.trim();
      const videosDiv = document.getElementById('videos');
      
      if (!query) {
        videosDiv.innerHTML = "<p>Please enter a keyword above 🔍</p>";
        return;
      }

      videosDiv.innerHTML = "<p>Loading...</p>";

      try {
        const res = await fetch(
          `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=5&q=${encodeURIComponent(query)}&key=${API_KEY}`
        );
        const data = await res.json();

        if (!data.items) {
          videosDiv.innerHTML = "<p>⚠️ Something went wrong. Check your API key or quota.</p>";
          return;
        }

        videosDiv.innerHTML = "";
        data.items.forEach(video => {
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <img src="${video.snippet.thumbnails.high.url}" alt="${video.snippet.title}">
            <h3>${video.snippet.title}</h3>
            <a href="https://www.youtube.com/watch?v=${video.id.videoId}" target="_blank">▶ Watch</a>
          `;
          videosDiv.appendChild(card);
        });
      } catch (err) {
        console.error(err);
        videosDiv.innerHTML = "<p>❌ Network error! Please check your internet.</p>";
      }
    }
  </script>

</body>
</html>
